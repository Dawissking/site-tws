<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0265d2" />
      <stop offset="100%" stop-color="#0b2559" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70C94A" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="14" fill="#ffffff" />
  <circle cx="32" cy="32" r="28" fill="url(#grad-blue)" />
  <!-- Reticle & Target -->
  <circle cx="32" cy="32" r="21" stroke="#ffffff" stroke-width="2.2" fill="none" opacity="0.9" />
  <line x1="32" y1="4" x2="32" y2="60" stroke="#ffffff" stroke-width="1.8" opacity="0.8" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#ffffff" stroke-width="1.8" opacity="0.8" />
  <!-- Tripod / Theodolite Base -->
  <polygon points="32,18 45,45 19,45" stroke="url(#grad-green)" stroke-width="3" fill="none" stroke-linejoin="round" />
  <line x1="32" y1="20" x2="32" y2="45" stroke="#ffffff" stroke-width="2.5" />
  <!-- Central Scope -->
  <circle cx="32" cy="32" r="6" fill="#70C94A" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="32" cy="32" r="2.5" fill="#0b2559" />
</svg>
